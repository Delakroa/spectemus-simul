# Public Internet gateway. Keep LAN /api/v1 and operator/actuator routes private.
server {
  # Only the Caddy app route sends PROXY v2; direct HTTP is rejected by Nginx.
  listen 80 proxy_protocol;
  server_name _;

  # Request URIs contain room IDs and may contain one-time credentials in
  # malformed or older clients. Do not retain request or error logs here.
  access_log off;
  error_log /dev/null;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  location = /gateway-health { return 404; }
  location ^~ /api/v1/ { return 404; }
  location = /api/v1 { return 404; }
  location ^~ /actuator/ { return 404; }
  location = /actuator { return 404; }
  location ^~ /operator/ { return 404; }
  location = /operator { return 404; }

  location ^~ /api/v2/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Never trust a client-supplied XFF. Caddy carries the source IP at L4.
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    include /etc/nginx/proxy-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|ico|png|jpg|jpeg|webp|woff2)$ {
    expires 1h;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}

# Internal container healthcheck only. No port is published for this listener.
server {
  listen 127.0.0.1:8081;
  location = /gateway-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
