# Opt-in Internet staging overlay. Never use without compose.yaml and a protected env file.
# The default staging and local stacks keep public access disabled.
services:
  backend:
    environment:
      PUBLIC_ACCESS_ENABLED: "true"
      PUBLIC_ACCESS_JDBC_URL: "${PUBLIC_ACCESS_JDBC_URL:?set PUBLIC_ACCESS_JDBC_URL}"
      PUBLIC_ACCESS_JDBC_USERNAME: "${PUBLIC_ACCESS_JDBC_USERNAME:?set PUBLIC_ACCESS_JDBC_USERNAME}"
      PUBLIC_ACCESS_JDBC_PASSWORD: "${PUBLIC_ACCESS_JDBC_PASSWORD:?set PUBLIC_ACCESS_JDBC_PASSWORD}"
      PUBLIC_ACCESS_IDENTITY_PEPPER: "${PUBLIC_ACCESS_IDENTITY_PEPPER:?set PUBLIC_ACCESS_IDENTITY_PEPPER}"
      PUBLIC_ACCESS_COOKIE_SECURE: "true"
      PUBLIC_ACCESS_EMAIL_HOST: "${PUBLIC_ACCESS_EMAIL_HOST:?set PUBLIC_ACCESS_EMAIL_HOST}"
      PUBLIC_ACCESS_EMAIL_PORT: "${PUBLIC_ACCESS_EMAIL_PORT:-587}"
      PUBLIC_ACCESS_EMAIL_USERNAME: "${PUBLIC_ACCESS_EMAIL_USERNAME:?set PUBLIC_ACCESS_EMAIL_USERNAME}"
      PUBLIC_ACCESS_EMAIL_PASSWORD: "${PUBLIC_ACCESS_EMAIL_PASSWORD:?set PUBLIC_ACCESS_EMAIL_PASSWORD}"
      PUBLIC_ACCESS_EMAIL_FROM: "${PUBLIC_ACCESS_EMAIL_FROM:?set PUBLIC_ACCESS_EMAIL_FROM}"
      PUBLIC_ACCESS_EMAIL_STARTTLS: "true"
      PUBLIC_DEVICE_BINDING_ENABLED: "true"
      PUBLIC_DEVICE_BINDING_VERIFICATION_ORIGIN: "https://${WT_STAGING_APP_DOMAIN:?set WT_STAGING_APP_DOMAIN}"
      PUBLIC_LIVEKIT_ENABLED: "true"
      PUBLIC_LIVEKIT_RTC_URL: "wss://${WT_STAGING_RTC_DOMAIN:?set WT_STAGING_RTC_DOMAIN}"
      PUBLIC_LIVEKIT_API_URL: "https://${WT_STAGING_RTC_DOMAIN:?set WT_STAGING_RTC_DOMAIN}"
      PUBLIC_LIVEKIT_API_KEY: "${PUBLIC_LIVEKIT_API_KEY:?set PUBLIC_LIVEKIT_API_KEY}"
      PUBLIC_LIVEKIT_API_SECRET: "${PUBLIC_LIVEKIT_API_SECRET:?set PUBLIC_LIVEKIT_API_SECRET}"
  gateway:
    build:
      args:
        VITE_INTERNET_ROOM_RUNTIME_ENABLED: "true"
        VITE_INTERNET_APP_ORIGIN: "https://${WT_STAGING_APP_DOMAIN:?set WT_STAGING_APP_DOMAIN}"
    volumes:
      - ./public-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/gateway-health"]
